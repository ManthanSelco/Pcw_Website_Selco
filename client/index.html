  }
}

@keyframes marquee-horizontal {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

  .marquee-tracks:hover {

}

.hamburger-wrapper img {
  transition: ease all .5s;
}

  position: absolute;
  transition: ease all .5s;
}

.hamburger-wrapper.active img:nth-child(2) {
  top: 12px;
  display: none;
  transition: ease all .5s;
}

.hamburger-wrapper.active img:first-child {
  transform: rotate(-45deg);
  top: 0;
  transition: ease all .5s;
}

.hamburger-wrapper.active img:last-child {
  transform: rotate(45deg);
  top: 0;
  transition: ease all .5s;
}
